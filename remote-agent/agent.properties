# Configuracao do Remote Agent
# Copie este arquivo para "agent.properties" na mesma pasta do remote-agent.jar

# Endereco WebSocket do remote-server
agent.server-uri=ws://localhost:8080/api/v1/ws/agent

# Largura maxima da imagem enviada (px). Ex: 960, 1280, 1920
agent.screen.max-width=1920

# Qualidade inicial do JPEG (0.1 a 1.0). A qualidade adapta-se automaticamente conforme a rede.
agent.screen.quality=0.55

# Meta de FPS (1 a 30)
agent.screen.fps=30
